name: Daily Tech News

on:
  schedule:
    # 00:50 UTC = 08:50 Asia/Taipei — ensures delivery before 09:00 local time
    - cron: "50 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip email send)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      top_n:
        description: "Number of top articles (default 10)"
        required: false
        default: "10"

env:
  PYTHON_VERSION: "3.11"
  CONFIG_PATH: "config/feeds.yml"
  DAILY_DIR: "daily"

jobs:
  # ── Unit Tests ─────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  # ── Main Pipeline ─────────────────────────────────────────────────────────
  send-news:
    name: Fetch · Rank · Send
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_CC: ${{ secrets.MAIL_CC }}
          NEWS_LANGUAGE: ${{ secrets.NEWS_LANGUAGE || 'en' }}
          TOP_N: ${{ github.event.inputs.top_n || secrets.TOP_N || '10' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          CONFIG_PATH: ${{ env.CONFIG_PATH }}
          DAILY_DIR: ${{ env.DAILY_DIR }}
        run: python -m src.main

      - name: Commit daily archive
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily/
          # Only commit if there are actual changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily archive $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit."
          fi
